  <div class="container">
    <!-- 로그인 화면 -->

      <div class="card" id="formContainer" style="max-height: 420px; overflow-y: auto;"></div>
      <button class="btn" onclick="backToMenu()" style="margin-top: 15px;">저장 및 목차로 돌아가기</button>

    <!-- 친구 목록 화면 -->
    <div id="screenFriendList" class="hidden">
      <div class="screen-header">
        <div>
          <h1>친구 목록</h1>
          <p class="subtitle" style="margin-bottom:0; text-align: left;">함께 연결된 친구들의 설명서입니다</p>

        <button class="hamburger-btn" onclick="backToMenuFromFriendList()">✕</button>

        <button class="btn btn-secondary" style="margin-top: 16px;" onclick="backToMenuFromFriendList()">돌아가기</button>
      </div>
    </div>

  <div id="toast">저장되었습니다!</div>

  <script>
    let currentUserData = null;
    let currentProfile = '';
    let previousProfile = '';
    let currentSection = '';
    let inviteHostEmail = null;

    const questionsMap = {
      '기본 정보': ['이름', '별명', '나이(출생년도)', '생일', '별자리', 'MBTI', '성격', '학교/직업', '사는곳(지역)'],
      '좋아하는 것': ['좋아하는 음식', '좋아하는 음료', '좋아하는 색', '좋아하는 계절', '좋아하는 동물', '좋아하는 장소', '좋아하는 노래', '좋아하는 음악장르', '좋아하는 영화', '좋아하는 책', '좋아하는 캐릭터', '좋아하는 향', '좋아하는 분위기', '좋아하는 사람의 성격', '좋아하는 타인의 행동', '좋아하는 상황'],
      '싫어하는 것': ['싫어하는 음식', '싫어하는 음료', '싫어하는 색', '싫어하는 계절', '싫어하는 동물', '싫어하는 장소', '싫어하는 노래', '싫어하는 음악장르', '싫어하는 영화', '싫어하는 책', '싫어하는 캐릭터', '싫어하는 향', '싫어하는 분위기', '싫어하는 사람의 성격', '싫어하는 타인의 행동', '싫어하는 상황'],
      '취미 및 일상': ['가장 좋아하는 취미', '요즘 자주 하는 것', '시간이 생기면 하고 싶은 것', '혼자 하는 취미', '다른 사람과 함께하는 취미', '집에서 즐기는 취미', '밖에서 즐기는 취미', '가장 좋아하는 순간', '새롭게 배워보고 싶은 것', '언젠가 꼭 해보고 싶은 것', '어릴 때 좋아했던 것', '취미를 할 때 필요한 것', '얼마나 많은 시간을 쓰는 편인지', '취미를 방해받았을 때의 반응', '취미를 같이 하고 싶은 사람', '최근 새로 생긴 취미', '남들에게 추천하고 싶은 취미', '가장 행복했던 순간'],
      '나를 대하는 방법': ['기분이 좋을 때의 특징', '기분이 안 좋을 때의 특징', '화났을 때의 반응', '슬플 때의 반응', '스트레스 받을 때의 반응', '힘들 때 필요한 것', '혼자 있고 싶을 때의 특징', '좋아하는 위로 방법', '싫어하는 위로 방법', '듣고 싶은 말', '듣기 싫은 말', '칭찬받을 때 좋아하는 방식', '화해할 때 원하는 방식', '부탁할 때 좋은 방법', '장난칠 때 주의할 점', '나를 편하게 해주는 행동', '나를 불편하게 만드는 행동', '가까워지는 방법', '고마움을 느끼는 행동', '사랑받는다고 느끼는 순간'],
      '사용 주의사항': ['건드리면 안 되는 것', '예민해지는 상황', '상처받는 말', '상처받는 행동', '하면 당황하는 행동', '하면 화나는 행동', '장난칠 때 주의할 점', '지켜줬으면 하는 것', '절대로 하지 말아야 할 것'],
      '선물': ['받고 싶은 선물', '좋아하는 선물 종류', '받으면 기분 좋은 것', '갖고 있지만 하나 더 받고 싶은 것', '선물로 받기 싫은 것', '선물할 때 선호하는 가격대', '직접 만든 선물에 대한 생각', '가장 기억에 남았던 선물', '언젠가 꼭 받고 싶은 선물']
    };

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const hostParam = urlParams.get('host');
      if (hostParam) {
        inviteHostEmail = hostParam;
        document.getElementById('loginMainTitle').innerText = `친구의 초대장`;
        document.getElementById('loginSubTitle').innerText = '로그인하거나 회원가입하여 설명서를 작성해주세요!';
      }
      history.replaceState({ screen: 'login' }, '', '');
      showScreen('screenLogin', false);
    };

    window.onpopstate = function(event) {
      if (event.state && event.state.screen) {
        showScreen(event.state.screen, false);
      }
    };

    function showScreen(screenId, push = true) {
      ['screenLogin', 'screenRegister', 'screenMain', 'screenMenu', 'screenForm', 'screenFriendList'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
      if (push) history.pushState({ screen: screenId }, '', '');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function goToRegisterScreen() { showScreen('screenRegister'); }
    function goToLoginScreen() { showScreen('screenLogin'); }
    function handleRegEnter(e) { if (e.key === 'Enter') handleRegisterSubmit(); }
    function handleLoginEnter(e) { if (e.key === 'Enter') handleLoginSubmit(); }

    async function handleRegisterSubmit() {
      const id = document.getElementById('regId').value.trim();
      const pw = document.getElementById('regPw').value.trim();
      if (!id || !pw) return showToast('아이디와 비밀번호를 입력해주세요!');
      try {
        const userCred = await window.fbFns.createUserWithEmailAndPassword(window.fbAuth, id, pw);
        const uid = userCred.user.uid;
        await window.fbFns.setDoc(window.fbFns.doc(window.fbDb, 'users', uid), {
          email: id,
          nickname: '',
          profiles: {},
          connectedFriends: []
        });
        showToast('회원가입 완료! 로그인해주세요.');
        goToLoginScreen();
      } catch (err) {
        showToast('회원가입 실패: ' + err.message);
      }
    }

    async function handleLoginSubmit() {
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value.trim();
      if (!id || !pw) return showToast('아이디와 비밀번호를 입력해주세요!');
      try {
        const userCred = await window.fbFns.signInWithEmailAndPassword(window.fbAuth, id, pw);
        const uid = userCred.user.uid;
        const docRef = window.fbFns.doc(window.fbDb, 'users', uid);
        const docSnap = await window.fbFns.getDoc(docRef);
        
        currentUserData = { uid, ...docSnap.data() };

        if (currentUserData.nickname && currentUserData.nickname.trim() !== '') {
          currentProfile = currentUserData.nickname + '의 설명서';
          showScreen('screenMenu');
          document.getElementById('menuTitle').innerText = currentProfile;
          refreshAllBadges();
        } else {
          showScreen('screenMain');
        }
      } catch (err) {
        showToast('로그인 실패: ' + err.message);
      }
    }

    function logoutAccount() {
      window.fbFns.signOut(window.fbAuth).then(() => location.reload());
    }

    function getEulLeul(word) {
      if (!word) return '를';
      const last = word.charCodeAt(word.length - 1);
      return (last >= 0xAC00 && (last - 0xAC00) % 28 > 0) ? '을' : '를';
    }

    function changeName() {
      const val = document.getElementById('name').value;
      document.getElementById('dynamicName').innerText = val || '나';
      document.getElementById('josa').innerText = getEulLeul(val);
    }

    function handleEnter(e) { if (e.key === 'Enter') goToMenu(); }

    async function goToMenu() {
      const nameInput = document.getElementById('name').value.trim();
      if (!nameInput) return showToast('이름을 입력해주세요!');

      currentUserData.nickname = nameInput;
      currentProfile = nameInput + '의 설명서';
      if (!currentUserData.profiles[currentProfile]) currentUserData.profiles[currentProfile] = {};

      await window.fbFns.updateDoc(window.fbFns.doc(window.fbDb, 'users', currentUserData.uid), {
        nickname: nameInput,
        [`profiles.${currentProfile}`]: {}
      });

      showScreen('screenMenu');
      document.getElementById('menuTitle').innerText = currentProfile;
      refreshAllBadges();
    }

    function toggleHamburgerMenu() {
      const dropdown = document.getElementById('hamburgerDropdown');
      const isMy = currentProfile === (currentUserData.nickname + '의 설명서');
      if (isMy) {
        dropdown.innerHTML = `
          <div class="dropdown-item" onclick="openAddFriendModal()">+ 친구 추가 (링크 복사)</div>
          <div class="dropdown-item" onclick="openFriendListModal()">👥 친구 목록 보기</div>
          <div class="dropdown-item" onclick="logoutAccount()">로그아웃</div>
        `;
      } else {
        dropdown.innerHTML = `
          <div class="dropdown-item" onclick="selectProfile('${currentUserData.nickname + '의 설명서'}')">내 설명서로 돌아가기</div>
          <div class="dropdown-item" onclick="openFriendListModal()">친구 목록으로 돌아가기</div>
        `;
      }
      dropdown.classList.toggle('show');
    }

    window.onclick = function(e) {
      if (!e.target.matches('.hamburger-btn')) {
        document.getElementById('hamburgerDropdown')?.classList.remove('show');
      }
    };

    function openAddFriendModal() {
      const baseUrl = window.location.origin + window.location.pathname;
      const inviteLink = `${baseUrl}?host=${encodeURIComponent(currentUserData.email)}`;
      navigator.clipboard.writeText(inviteLink).then(() => showToast('친구 초대 링크가 복사되었습니다!'));
    }

    async function openFriendListModal() {
      previousProfile = currentProfile;
      const docSnap = await window.fbFns.getDoc(window.fbFns.doc(window.fbDb, 'users', currentUserData.uid));
      const friends = docSnap.data().connectedFriends || [];
      
      const container = document.getElementById('friendListContainer');
      if (friends.length === 0) {
        container.innerHTML = '<div style="padding:10px; color:#7d756d;">등록된 친구가 없습니다.</div>';
      } else {
        container.innerHTML = friends.map(f => `
          <div class="friend-card-item" onclick="selectProfile('${f.nickname}의 설명서')">
            <div class="friend-info">
              <div class="friend-avatar">${f.nickname.charAt(0)}</div>
              <div><div class="friend-name">${f.nickname}</div><div class="friend-sub">사용설명서</div></div>
            </div>
            <button class="friend-action-btn">보기</button>
          </div>
        `).join('');
      }
      showScreen('screenFriendList');
    }

    function selectProfile(title) {
      currentProfile = title;
      showScreen('screenMenu');
      document.getElementById('menuTitle').innerText = currentProfile;
      refreshAllBadges();
      showToast('설명서가 전환되었습니다.');
    }

    function backToMenuFromFriendList() {
      showScreen('screenMenu');
      currentProfile = previousProfile || (currentUserData.nickname + '의 설명서');
      document.getElementById('menuTitle').innerText = currentProfile;
      refreshAllBadges();
    }

    async function handleInputChange() {
      const inputs = document.querySelectorAll('#formContainer input');
      const sectionData = {};
      inputs.forEach((inp, idx) => sectionData['f' + (idx + 1)] = inp.value);

      currentUserData.profiles[currentProfile][currentSection] = sectionData;
      await window.fbFns.updateDoc(window.fbFns.doc(window.fbDb, 'users', currentUserData.uid), {
        [`profiles.${currentProfile}.${currentSection}`]: sectionData
      });
      updateBadgeStatus(currentSection);
    }

    function updateBadgeStatus(sec) {
      const data = currentUserData.profiles[currentProfile]?.[sec];
      const badge = document.getElementById('badge-' + sec);
      if (!badge) return;
      const total = questionsMap[sec].length;
      let filled = 0;
      for (let i = 1; i <= total; i++) {
        if (data && data['f' + i]?.trim()) filled++;
      }
      if (filled === total) badge.classList.add('completed');
      else badge.classList.remove('completed');
    }

    function refreshAllBadges() {
      Object.keys(questionsMap).forEach(sec => updateBadgeStatus(sec));
    }

    function openSection(title) {
      currentSection = title;
      document.getElementById('sectionTitle').innerText = title;
      document.getElementById('sectionSub').innerText = currentProfile + ' - 내용을 채워주세요';

      if (!currentUserData.profiles[currentProfile]) currentUserData.profiles[currentProfile] = {};
      const data = currentUserData.profiles[currentProfile][currentSection] || {};
      const questions = questionsMap[title] || [];

      document.getElementById('formContainer').innerHTML = questions.map((q, idx) => `
        <div class="input-group">
          <label>${idx + 1}. ${q}</label>
          <input type="text" value="${data['f' + (idx + 1)] || ''}" placeholder="${q} 입력" oninput="handleInputChange()">
        </div>
      `).join('');

      showScreen('screenForm');
    }

    function backToMenu() {
      showScreen('screenMenu');
      refreshAllBadges();
      showToast('저장되었습니다!');
    }
  </script>
</body>
</html>
